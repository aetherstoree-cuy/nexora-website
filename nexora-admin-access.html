<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin – NEXORA</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var d=document.documentElement;d.className+=" js";var t=null;try{t=localStorage.getItem("nexora-theme")}catch(e){}if(t!=="dark"&&t!=="light"){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}d.dataset.theme=t})()</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dash.css">
<script src="script.js" defer></script>
<script src="dash.js" defer></script>
</head>
<body>
<header class="topbar bare">
  <div class="wrap">
    <a class="logo" href="/"><span class="logo-card"><img src="img/logo.png" alt="NEXORA" style="width: 45px; height: 45px;"></span><span class="logo-name">NEXORA</span></a>
    <div class="nav-right">
      <a class="btn btn-icon dc-icon" href="https://discord.gg/7bFYCRheRm" target="_blank" rel="noopener" aria-label="Server Discord" title="Server Discord"><i class="bi bi-discord"></i></a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Ganti mode terang atau gelap"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
  </div>
</header>

<main class="wrap auth" data-dash="alogin"><div class="auth-card">
<h1>Panel Admin</h1><p class="muted">Khusus tim NEXORA.</p>
<form style="margin-top:18px"><label class="fld"><span>Email <em class="req">*</em></span><input class="inp" type="email" name="email" required autocomplete="email"></label><label class="fld"><span>Password <em class="req">*</em></span><div class="pw"><input class="inp" type="password" name="password" required autocomplete="current-password"><button class="pw-t" type="button" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button></div></label><button class="btn" type="submit">Masuk</button></form>
<p class="demo-note">Mode demo: belum terhubung ke database. Isi bebas untuk mencoba.</p></div></main>
</body>
</html>
